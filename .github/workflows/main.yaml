name: Continuous integration

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

env:
  POETRY_INSTALLER_ONLY_BINARY: 'true'

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt
      - run: pip install --editable=.

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files --color=always
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()

      - id: success
        run: echo "::set-output name=success::true"

  main:
    name: Continuous integration
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - name: Install with Poetry
        run: poetry install
      - name: Compile translations
        run: poetry run python3 scripts/build.py

      - name: Prospector
        run: |
          poetry run prospector --output-format=pylint --direct-tool-stdout

      - name: Test with pytest
        run: |
          poetry run pytest tests -vv

      - id: success
        run: echo "::set-output name=success::true"

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: always()
    needs:
      - pre-commit
      - main

    permissions:
      contents: read
      id-token: write

    steps:
      - run: "[[ ${{ needs.pre-commit.outputs.success }} == 'true' ]]"
      - run: "[[ ${{ needs.main.outputs.success }} == 'true' ]]"

      # The full history is required to compute the version from the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Provides the pip, python3 and poetry that tag-publish calls to build the wheel.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          cache-python: true
          python-version: '3.13'

      - name: Compile translations
        run: |
          poetry install --only main --no-root
          poetry run python3 scripts/build.py
      # tag-publish logs in to PyPI by itself with the OpenId Connect token, and only when the context publishes.
      - name: Publish
        run: uv run --locked --isolated --no-build --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          sed --in-place 's/jsonschema2md/jsonschema2md2/g' pyproject.toml
          sed --in-place 's@jsonschema2md/locales@jsonschema2md2/locales@g' pyproject.toml
          sed --in-place 's@sbrunner/jsonschema2md2@sbrunner/jsonschema2md@g' pyproject.toml
          sed --in-place 's/jsonschema2md/jsonschema2md2/g' jsonschema2md/__init__.py
          sed --in-place 's/jsonschema2md/jsonschema2md2/g' scripts/build.py
          git diff
          mv jsonschema2md jsonschema2md2
      - name: Publish
        run: uv run --locked --isolated --no-build --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
